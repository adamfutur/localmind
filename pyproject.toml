[project]
name = "localmind"
version = "0.1.0"
description = "Local-first document and code intelligence"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "backend/app",
    "backend/main.py",
    "data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]
